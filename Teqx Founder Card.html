<title>Teqx Founder Card</title>

<style>
/* Layout: controls column left, sticky live card preview right; stacks on phones. Brand: Teqx blue + ink from the logo. */
:root {
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --ink: #231F20;
  --muted: #5A6372;
  --line: #D9E0EC;
  --brand: #0B63CE;
  --brand-ink: #0B63CE;
  --on-brand: #FFFFFF;
  --field: #FFFFFF;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --ink: #EEF2F8; --muted: #9AA6B8; --line: #2A3445;
    --brand: #0B63CE; --brand-ink: #6AA6FF; --field: #101722; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --ink: #EEF2F8; --muted: #9AA6B8; --line: #2A3445;
  --brand: #0B63CE; --brand-ink: #6AA6FF; --field: #101722; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1160px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
header .mark { height: 44px; width: auto; }
header h1 { font-family: var(--display); font-size: clamp(22px, 4vw, 30px); font-weight: 400; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); flex-basis: 100%; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .preview { position: static !important; order: -1; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 20px; min-width: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
label, .lbl { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input[type=text], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 11px 13px; min-height: 44px;
}
textarea { resize: vertical; min-height: 96px; }
input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible, .file:focus-within, input[type=range]:focus-visible {
  outline: 3px solid var(--brand-ink); outline-offset: 2px;
}
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.count { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
h2 { font-size: 15px; margin: 0; font-weight: 800; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.file { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-weight: 700; cursor: pointer; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 18px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-size: 17px; padding: 0 26px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); padding: 0 16px; min-height: 40px; display: inline-flex; align-items: center; cursor: pointer; background: var(--field); }
.seg input:checked + label { background: var(--brand); color: var(--on-brand); }
.seg input:focus-visible + label { outline: 3px solid var(--brand-ink); outline-offset: -3px; }
.sliders { display: grid; gap: 14px; }
.sl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; }
.sl label { font-size: 12px; }
input[type=range] { width: 100%; accent-color: var(--brand); min-height: 32px; }
.preview { position: sticky; top: 16px; display: grid; gap: 14px; min-width: 0; }
.card-shell { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #fff; line-height: 0; }
canvas { display: block; width: 100%; height: auto; touch-action: pan-y; }
canvas.draggable { cursor: grab; }
canvas.dragging { cursor: grabbing; }
.status { min-height: 22px; font-size: 14px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) { button, .file { transition: filter .15s; } button:hover, .file:hover { filter: brightness(1.08); } }
</style>

    <h1>Founder Card</h1>
    <p>Fill in your details, set up your photo, then download or share the card as a PNG (1080 × 1350, ready for Instagram).</p>
  </header>

  <div class="grid">
    <div class="panel" id="controls">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" maxlength="40" value="Your Name" autocomplete="name">
      </div>
      <div class="field">
        <label for="role">Role</label>
        <input type="text" id="role" maxlength="60" value="Founder, Teqx Studio">
      </div>

      <hr>
      <h2>Photo</h2>
      <div class="row">
        <span class="file"><span>Upload photo</span><input type="file" id="photo" accept="image/*" aria-label="Upload photo"></span>
        <button type="button" id="removePhoto" disabled>Remove</button>
      </div>
      <div class="field">
        <span class="lbl" id="shapeLbl">Photo shape</span>
        <div class="seg" role="radiogroup" aria-labelledby="shapeLbl">
          <input type="radio" name="shape" id="s1" value="portrait" checked><label for="s1">Portrait</label>
          <input type="radio" name="shape" id="s2" value="square"><label for="s2">Square</label>
          <input type="radio" name="shape" id="s3" value="circle"><label for="s3">Circle</label>
        </div>
      </div>
      <div class="sliders">
        <div class="sl"><label for="zoom">Size</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
        <div class="sl"><label for="panx">Left / Right</label><input type="range" id="panx" min="-1" max="1" step="0.01" value="0"></div>
        <div class="sl"><label for="pany">Up / Down</label><input type="range" id="pany" min="-1" max="1" step="0.01" value="0"></div>
      </div>
      <p class="hint">On a computer you can also drag the photo directly on the card.</p>

      <hr>
      <div class="field">
        <label for="view">Your view on Teqx Studio</label>
        <textarea id="view" maxlength="320">Write your view on Teqx Studio here: what we stand for and where we are headed.</textarea>
        <div class="count" id="viewCount"></div>
      </div>
      <div class="field">
        <label for="fact">A fun fact about you</label>
        <textarea id="fact" maxlength="160">Add a fun fact about yourself here.</textarea>
        <div class="count" id="factCount"></div>
      </div>
    </div>

    <div class="preview">
      <div class="card-shell"><canvas id="card" width="1080" height="1350" role="img" aria-label="Founder card preview"></canvas></div>
      <div class="row">
        <button type="button" class="primary" id="save">Download / Share PNG</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>

    }).catch(function (err) {

      say(c === 'declined' ? 'Save cancelled.' : c === 'rate_limited' ? 'Wait a moment, then try again.' : 'Could not save here. Right-click the card and choose Save image.');
    });
  }

  // fonts, then first paint
  draw();
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('40px "Archivo Black"'),
      document.fonts.load('500 30px Manrope'), document.fonts.load('600 30px Manrope'),
      document.fonts.load('700 30px Manrope'), document.fonts.load('800 30px Manrope')
    ]).then(draw, draw);
  }
})();
</script>
